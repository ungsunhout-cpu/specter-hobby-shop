<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shop | Specter Hobby Shop</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body data-page="shop">
        <div id="site-header"></div>
        <main>
            <section class="page-hero">
                <div class="container">
                    <p class="eyebrow">The full catalog</p>
                    <h1>Find your <span>next build.</span></h1>
                    <p>Tools, kits and finishing touches for every kind of builder.</p>
                </div>
            </section>
            <section class="shop-layout container">
                <aside class="filters">
                    <div class="filter-top">
                        <h2>Filter by</h2>
                        <button id="clear-filters" class="clear-button">Clear all</button>
                    </div>
                    <label>Search
                        <input type="search" id="product-search" placeholder="Search products..." />
                    </label>
                    <label>Category
                        <select id="category-filter">
                            <option value="all">All categories</option>
                            <option>Gundam</option>
                            <option>Tamiya</option>
                            <option>Military</option>
                            <option>Tools</option>
                            <option>Paints</option>
                            <option>Accessories</option>
                        </select>
                    </label>
                    <label>Brand
                        <select id="brand-filter">
                            <option value="all">All brands</option>
                            <option>Bandai</option>
                            <option>Tamiya</option>
                            <option>Vallejo</option>
                            <option>Specter</option>
                            <option>AFV Club</option>
                        </select>
                    </label>
                    <label>Price range
                        <select id="price-filter">
                            <option value="all">Any price</option>
                            <option value="0-30">Under $30</option>
                            <option value="30-60">$30 - $60</option>
                            <option value="60-999">Over $60</option>
                        </select>
                    </label>
                    <label class="check-label">
                        <input type="checkbox" id="stock-filter" /> In stock only
                    </label>
                    <label>Rating
                        <select id="rating-filter">
                            <option value="0">Any rating</option>
                            <option value="4">4 stars &amp; up</option>
                            <option value="4.5">4.5 stars &amp; up</option>
                        </select>
                    </label>
                </aside>
                <div class="shop-results">
                    <div class="results-bar">
                        <div class="results-count"><strong id="product-count">0</strong> products</div>
                        <select id="sort-products" aria-label="Sort products">
                            <option value="featured">Featured</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                            <option value="newest">Newest</option>
                            <option value="selling">Best Selling</option>
                        </select>
                    </div>
                    <div class="product-grid" id="shop-products"></div>
                </div>
            </section>
        </main>
        <div id="site-footer"></div>
        <div id="cart-drawer"></div>
        <script src="script.js"></script>
    </body>
</html >
